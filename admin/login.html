<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/extras.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
    <title>Administración | Casa Pueblo</title>
  </head>
  <body class="admin-body">
    <main class="login-page">
      <form class="login-card" id="loginForm"><a href="../index.html" class="logo">
            Casa Pueblo
            <span>ADMINISTRACIÓN</span>
        </a>
        <p class="eyebrow">ÁREA PRIVADA</p>
        <h1>Iniciar sesión</h1>
        <p class="login-description">
            Accede al panel de administración para gestionar
            solicitudes, comunidades y usuarios autorizados.</p>
        <div class="form-group"><label for="username">Usuario</label><input id="username" type="text" autocomplete="username" required></div>
        <div class="form-group"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
        <p class="login-error" id="loginError" role="alert"></p><button class="button primary" type="submit">
            Entrar al panel
        </button>
        <div class="demo-credentials" id="demoCredentials" hidden><strong>Acceso de demostración</strong><span>Usuario: <b>admin</b></span><span>Contraseña: <b>admin123</b></span></div>
        <p class="login-back"><a href="../index.html">← Volver al sitio público</a></p></form>
    </main>
    <script>
const form = document.getElementById("loginForm");
const error = document.getElementById("loginError");
const submit = form.querySelector('button[type="submit"]');

// The development account only exists on a local database (npm run seed).
if (["localhost", "127.0.0.1"].includes(location.hostname)) {
    document.getElementById("demoCredentials").hidden = false;
}

form.addEventListener("submit", async event => {
    event.preventDefault();
    error.textContent = "";
    submit.disabled = true;

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({
                username: document.getElementById("username").value.trim(),
                password: document.getElementById("password").value
            })
        });

        if (response.ok) {
            window.location.href = "dashboard.html";
            return;
        }

        const data = await response.json().catch(() => ({}));
        error.textContent = data.error || "No se pudo iniciar sesión.";
    } catch {
        error.textContent = "No se pudo conectar con el servidor.";
    } finally {
        submit.disabled = false;
    }
});
    </script>
  </body>
</html>

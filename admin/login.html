<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/admin.css">
    <title>Administración | Casa Pueblo</title>
  </head>
  <body class="admin-body">
    <main class="login-page">
      <form class="login-card" id="loginForm"><a href="../index.html" class="logo">
            Casa Pueblo
            <span>ADMINISTRACIÓN</span>
        </a>
        <p class="eyebrow">ÁREA PRIVADA</p>
        <h1>Iniciar sesión</h1>
        <p class="login-description">
            Accede al panel de administración para gestionar
            solicitudes, comunidades y usuarios autorizados.</p>
        <div class="form-group"><label for="username">Usuario</label><input id="username" type="text" autocomplete="username" required></div>
        <div class="form-group"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
        <p class="login-error" id="loginError" role="alert"></p><button class="button primary" type="submit">
            Entrar al panel
        </button>
        <div class="demo-credentials"><strong>Acceso de demostración</strong><span>Usuario: <b>admin</b></span><span>Contraseña: <b>admin123</b></span></div>
        <p class="login-back"><a href="../index.html">← Volver al sitio público</a></p></form>
    </main>
    <script>
const form = document.getElementById("loginForm");
const error = document.getElementById("loginError");

form.addEventListener("submit", event => {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    let valid = username === "admin" && password === "admin123";

    // Also allow active admins created in the Administradores page.
    const saved = JSON.parse(localStorage.getItem("casaPuebloAdmins") || "[]");
    const createdAdmin = saved.find(
        admin => admin.username === username &&
                 admin.password === password &&
                 admin.active
    );

    if (createdAdmin) valid = true;

    if (!valid) {
        error.textContent = "El usuario o la contraseña no son correctos.";
        return;
    }

    localStorage.setItem("casaPuebloAdminSession", JSON.stringify({
        username,
        loginAt: new Date().toISOString()
    }));

    window.location.href = "dashboard.html";
});
    </script>
  </body>
</html>

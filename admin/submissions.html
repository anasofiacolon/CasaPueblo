<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/extras.css">
    <title>Solicitudes | Casa Pueblo</title>
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <aside class="sidebar"><a href="dashboard.html" class="logo">Casa Pueblo<span>ADMINISTRACIÓN</span></a>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a href="submissions.html">Solicitudes</a>
          <a href="submission.html">Revisión</a>
          <a href="comunidades.html">Comunidades</a>
          <a href="administradores.html">Administradores</a>
        </nav>
        <a class="logout" href="login.html">Cerrar sesión</a></aside>
      <main class="admin-main">
        <div class="admin-top">
          <div>
            <p class="eyebrow">CONTENIDO</p>
            <h1 style="font-size:3rem">Solicitudes</h1>
          </div>
        </div>
        <div class="toolbar">
          <div class="filters"><button class="filter active" data-status="">Todas</button><button class="filter" data-status="pending">Pendientes</button><button class="filter" data-status="approved">Aprobadas</button><button class="filter" data-status="rejected">Rechazadas</button>
      </div><input class="search" id="search" type="search" placeholder="Buscar comunidad..." aria-label="Buscar comunidad">
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Comunidad
                </th>
                <th>Ubicación
                </th>
                <th>Enviada
                </th>
                <th>Estado
                </th>
                <th>Acción
                </th>
              </tr>
            </thead>
            <tbody id="submissionsBody"><tr><td colspan="5" class="empty-state">Cargando…</td></tr></tbody>
          </table>
        </div>
      </main>
    </div>
    <script src="../js/admin.js"></script>
    <script>
const { api, esc, formatDate, statusBadge } = CPAdmin;
const body = document.getElementById("submissionsBody");
const search = document.getElementById("search");
let status = "";

async function load() {
    const query = new URLSearchParams();
    if (status) query.set("status", status);
    if (search.value.trim()) query.set("q", search.value.trim());

    try {
        const { submissions } = await api(`/api/admin/submissions?${query}`);
        body.innerHTML = submissions.length
            ? submissions.map(s => `
                <tr>
                    <td>${esc(s.community_name)}</td>
                    <td>${s.location_text ? esc(s.location_text) : '<span class="muted">Sin ubicación</span>'}</td>
                    <td>${formatDate(s.created_at)}</td>
                    <td>${statusBadge(s.status)}</td>
                    <td><a class="small-button" href="submission.html?id=${s.id}">Abrir</a></td>
                </tr>`).join("")
            : `<tr><td colspan="5" class="empty-state">No hay solicitudes que coincidan.</td></tr>`;
    } catch (err) {
        body.innerHTML = `<tr><td colspan="5" class="empty-state">${esc(err.message)}</td></tr>`;
    }
}

document.querySelectorAll(".filter").forEach(button => button.addEventListener("click", () => {
    document.querySelectorAll(".filter").forEach(b => b.classList.toggle("active", b === button));
    status = button.dataset.status;
    load();
}));

let timer;
search.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(load, 250);
});

load();
    </script>
  </body>
</html>
